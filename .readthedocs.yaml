# ReadTheDocs build: the API pages are generated by mkdocstrings from the
# source (static analysis), so only the `docs` dependency group is installed
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --only-group docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
