[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tysserand"
version = "0.6.0"
description = "Fast and accurate spatial networks reconstruction."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Alexis Coullomb", email = "alexis.coullomb.pro@gmail.com" }]
requires-python = ">=3.10"
keywords = ["spatial networks", "bioimage", "spatial omics", "sociology", "econometrics"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# Core = what the reconstruction, conversion, IO and plotting functions use.
# Only numpy, pandas, scipy and joblib are imported at module load, the
# others are imported inside the functions using them.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "joblib",
    "scikit-learn",          # build_knn, build_rdn, build_lattice
    "pynndescent",           # build_knn on large sets
    "scikit-image",          # build_contacting, mask_val_coord
    "opencv-python-headless",  # build_contacting
    "matplotlib",            # plot_*
    "seaborn",               # plot_*
]

[project.optional-dependencies]
# Interactive visualization and annotation (annotation module)
napari = ["napari[all]"]
# Bridges to other libraries (interop module)
interop = ["networkx", "igraph", "anndata"]
# Jupyter notebooks in examples/, including the publication figures (PySAL)
notebooks = [
    "ipykernel",
    "scanpy",
    "cairocffi",
    "libpysal",
    "geopandas",
    "pyarrow",
]
all = ["tysserand[napari,interop,notebooks]"]

[dependency-groups]
dev = ["pytest", "pyarrow", "networkx", "igraph", "anndata"]

[project.urls]
Homepage = "https://github.com/VeraPancaldiLab/tysserand"
Paper = "https://doi.org/10.1093/bioinformatics/btab490"

[tool.setuptools.packages.find]
include = ["tysserand*"]
